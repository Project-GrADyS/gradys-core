[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradys-core"
version = "0.1.0"
description = "Shared, extensible, statically-typed protocol interface for GrADyS-SIM NextGen and gradys-embedded"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["gradys", "protocol", "simulation", "drone", "uav", "LAC", "PUC"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "mypy==2.3.0",
    "pyright==1.1.411",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gradys_core = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src", "tests"]
mypy_path = "src"

# Third-party stubs in the developer's interpreter may use syntax newer than our 3.10
# target (numpy's .pyi uses 3.12 `type` statements). We do not depend on them; do not
# parse them.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
